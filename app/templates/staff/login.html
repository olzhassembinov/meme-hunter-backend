{% extends "staff/base.html" %}
{% block title %}Log in · Meme Hunter staff{% endblock %}
{% block content %}
<form class="card login" method="post" action="/staff/login">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Username <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit">Log in</button>
</form>
{% endblock %}
